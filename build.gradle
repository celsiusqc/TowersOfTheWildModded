plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	// CurseForge upload support for the publishCurseForge task below
	id 'net.darkhax.curseforgegradle' version '1.1.26'
}

version = "fabric-${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

loom {
	mods {
		"totw_modded" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Publish to CurseForge: needs curseforge_token in ~/.gradle/gradle.properties
// or a CURSEFORGE_TOKEN environment variable (e.g. a GitHub Actions secret).
tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	apiToken = findProperty('curseforge_token') ?: System.getenv('CURSEFORGE_TOKEN')

	def mainFile = upload(859365, tasks.findByName('remapJar') ?: jar)
	mainFile.displayName = "totw_modded-fabric-${minecraft_version}-${mod_version}"
	mainFile.releaseType = 'release'
	mainFile.changelog = 'See https://github.com/zachsai/TowersOfTheWildModded for changes.'
	mainFile.changelogType = 'markdown'
	mainFile.addModLoader('Fabric')
	mainFile.addGameVersion(minecraft_version)
	mainFile.addJavaVersion('Java 25')
	// CurseForge requires an environment tag
	mainFile.addGameVersion('Client')
	mainFile.addGameVersion('Server')
	mainFile.addRequirement('fabric-api')
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
