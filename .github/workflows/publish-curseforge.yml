name: Publish to CurseForge

# Manual trigger only: run it from the Actions tab on the branch you want to release.
# Requires the repository secret CURSEFORGE_TOKEN (Settings -> Secrets and variables
# -> Actions), created at https://authors.curseforge.com -> Account -> API Tokens.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and publish
        run: ./gradlew build publishCurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
